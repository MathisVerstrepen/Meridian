name: Lint, Build and Push Docker Images

on:
  push:
    tags: ["*.*.*-beta"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('meridian-release-{0}', github.repository) || format('docker-publish-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta$ ]]; then
            echo "Tag must be a strict non-v X.Y.Z-beta version." >&2
            exit 1
          fi

      - name: Verify release is newest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          python scripts/release_automation.py verify-promotion
          --repository "$GITHUB_REPOSITORY"
          --version "$RELEASE_VERSION"

      - name: Run release automation tests
        run: python -m unittest discover -s scripts/tests -p 'test_release_automation.py'

      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt', 'api/requirements-dev.txt', 'browser_service/requirements.txt', 'browser_service/requirements-dev.txt', 'sandbox_manager/requirements.txt', 'sandbox_manager/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
          pip install -r browser_service/requirements.txt -r browser_service/requirements-dev.txt
          pip install -r sandbox_manager/requirements.txt -r sandbox_manager/requirements-dev.txt

      - name: Run backend linters
        run: ./api/run-linter.sh

      - name: Run sandbox manager checks
        run: ./sandbox_manager/run-checks.sh

      - name: Run browser service checks
        run: |
          python -m black --config browser_service/pyproject.toml --check browser_service/app browser_service/tests
          python -m isort --settings-path browser_service/pyproject.toml --check-only browser_service/app browser_service/tests
          python -m flake8 --max-line-length=100 browser_service/app browser_service/tests
          python -m mypy --config-file browser_service/pyproject.toml browser_service/app
          python -m pytest browser_service/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: cd ui && pnpm install --frozen-lockfile

      - name: Run frontend linter
        run: cd ui && pnpm lint

  build-and-push:
    name: Build ${{ matrix.name }} image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: frontend
            image: frontend
            dockerfile: ./docker/ui.Dockerfile
            cache-scope: frontend
            frontend: true
          - name: backend
            image: backend
            dockerfile: ./docker/api.Dockerfile
            cache-scope: backend
            frontend: false
          - name: browser-service
            image: browser-service
            dockerfile: ./docker/browser-service.Dockerfile
            cache-scope: browser-service
            frontend: false
          - name: sandbox-manager
            image: sandbox-manager
            dockerfile: ./docker/sandbox-manager.Dockerfile
            cache-scope: sandbox-manager
            frontend: false
          - name: sandbox-python
            image: sandbox-python
            dockerfile: ./docker/sandbox-python.Dockerfile
            cache-scope: sandbox-python
            frontend: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.frontend && format('NUXT_PUBLIC_VERSION={0}', steps.meta.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,scope=${{ matrix.cache-scope }},mode=max

  promote-images:
    name: Promote Docker images to latest
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta$ ]]; then
            echo "Tag must be a strict non-v X.Y.Z-beta version." >&2
            exit 1
          fi

      - name: Checkout trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prevalidate and promote image manifests
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          images=(frontend backend browser-service sandbox-manager sandbox-python)
          repository="${GITHUB_REPOSITORY,,}"
          sources=()
          digests=()

          for image in "${images[@]}"; do
            source="$REGISTRY/$repository/$image:$RELEASE_VERSION"
            digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -er '.digest')"
            sources+=("$source")
            digests+=("$digest")
          done

          python scripts/release_automation.py verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION"
          unset RELEASE_TOKEN

          for index in "${!sources[@]}"; do
            target="${sources[$index]%:$RELEASE_VERSION}:latest"
            source="${sources[$index]%:$RELEASE_VERSION}@${digests[$index]}"
            docker buildx imagetools create --prefer-index=false --tag "$target" "$source"
          done

  promote-release:
    name: Promote GitHub Release
    needs: promote-images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta$ ]]; then
            echo "Tag must be a strict non-v X.Y.Z-beta version." >&2
            exit 1
          fi

      - name: Checkout trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Wait for and promote GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python scripts/release_automation.py verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION"

          release_found=false
          for attempt in {1..12}; do
            if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_found=true
              break
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done
          if [[ "$release_found" != true ]]; then
            echo "GitHub Release $RELEASE_VERSION was not found after 12 attempts." >&2
            exit 1
          fi

          python scripts/release_automation.py verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION"
          gh release edit "$RELEASE_VERSION" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
